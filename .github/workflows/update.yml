name: Auto Convert DAV to JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Converter
        run: python convert_dav.py

      - name: Commit & Push Updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add timetable.json
          git diff-index --quiet HEAD || git commit -m "Auto-convert .dav to timetable.json"
          git pull --rebase origin main
          git push
