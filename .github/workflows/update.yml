name: Auto Update Timetable

on:
  schedule:
    # Jalan automatik setiap 4 jam
    - cron: '0 */4 * * *'
  # Membolehkan kau tekan butang 'Run workflow' secara manual untuk test
  workflow_dispatch:

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python sync_timetable.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add timetable.json
          git diff-index --quiet HEAD || git commit -m "Auto-update jadual dari emel"
          git push
